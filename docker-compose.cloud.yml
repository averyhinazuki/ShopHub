# Cloud deploy stack. Differences from docker-compose.yml:
#   - app/nginx images are pulled from GHCR (built by CI), not built here.
#   - Middleware ports aren't published — containers talk over the internal
#     network; only nginx :80 is exposed.
#   - MySQL/MongoDB bind-mount /data/* on the persistent EBS volume so their
#     data survives instance replacement (see infra/terraform/persistent/).
#   - Every service carries a mem_limit, sized for a 4 GiB instance
#     (c7i-flex.large). Keep instance_type in terraform.tfvars in sync.
#     App caps (-Xmx, buffer pool, maxmemory, WT cache) bound one pool each and
#     are NOT a substitute: mem_limit bounds total RSS, so the offender dies with
#     exit 137 instead of the host OOM killer picking an innocent stateful
#     container. Values are MEASURED from a local run of this stack, not
#     estimated (idle RSS in each note below). Total 3456 MiB, 640 for the host.
#     Re-measure before adding a service; see F18 in docs/study/90-findings.md.
#
# Kafka is required: checkout is async (initiateCheckout publishes a
# CheckoutRequestedEvent; CheckoutRequestedConsumer does the work), so with no
# broker every checkout hangs PENDING.
#
# Secrets (MYSQL_ROOT_PASSWORD, JWT_SECRET) are read from a .env written next to
# this file at deploy time by infra/terraform/user_data.sh.tpl — never hardcoded.

services:

  app:
    image: ${APP_IMAGE:-ghcr.io/averyhinazuki/shophub:latest}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/flash_sale_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/flash_sale_logs
      JWT_SECRET: ${JWT_SECRET}
      # Explicit heap cap — the 25%-of-container default is too generous with
      # five other processes on a 4 GiB box.
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    # 1g against -Xmx512m. Measured 559 MiB RSS with the heap at only 187/512
    # MiB, plus 190 MiB non-heap — a full heap lands near 900 MiB. 768m looked
    # fine at idle (73%) and would have been OOM-killed under flash-sale load.
    mem_limit: 1024m
    healthcheck:
      # `up -d` returns once containers are *started*, so without this a Spring
      # startup failure crash-loops while the deploy reports success. curl is
      # installed in Dockerfile's runtime stage specifically for this.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started   # no simple health-check for Kafka

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: flash_sale_db
    # Pin the buffer pool to document the memory budget explicitly.
    command: --innodb-buffer-pool-size=128M
    # 768m against a 128M buffer pool. Measured 456 MiB RSS IDLE on an empty
    # DB — 89% of the 512m first proposed, before any of the 50 Hikari
    # connections allocated per-connection buffers. MySQL is the container this
    # finding exists to protect; arithmetic sizing nearly did the opposite.
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Bind-mount the persistent EBS volume ($DATA_DIR=/data), not a named volume,
    # so data survives instance replacement. See infra/terraform/persistent/.
    volumes:
      - ${DATA_DIR:-./data}/mysql:/var/lib/mysql

  redis:
    image: redis:7
    restart: unless-stopped
    # NOT just a cache. Four key types, only the first disposable:
    # product:*:detail 60s, checkout:* 30m, kafka:processed:* 24h, refresh:* 1d.
    # allkeys-lru evicted any of them under memory pressure (measured: all three
    # non-cache types lost; volatile-ttl kept all three at equal cache headroom).
    # Shortest-TTL-first IS the priority order wanted. volatile-lru would not
    # help - all four carry TTLs. Heuristic, not a guarantee: a separate instance
    # for state, or dedup in MySQL, is the durable fix. See F17 in docs/study.
    # appendonly + volume: a restart used to wipe all four types outright.
    command: --maxmemory 128mb --maxmemory-policy volatile-ttl --appendonly yes
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${DATA_DIR:-./data}/redis:/data

  # Single-node KRaft (no ZooKeeper), replication factor 1. Quorum voter uses the
  # service name so it stays correct if broker/controller are ever split out.
  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Default 1 GiB heap is cluster-sized; 256m is plenty single-node.
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    # 512m against a 256m heap: non-heap overhead plus direct buffers.
    mem_limit: 512m
    # No volume — MySQL is the source of truth, so losing queued events on a
    # broker restart is acceptable here.

  mongodb:
    image: mongo:6
    restart: unless-stopped
    # Cap WiredTiger cache (default ~50% of RAM); 0.25 GiB suffices for logs.
    command: --wiredTigerCacheSizeGB 0.25
    # 384m against a 0.25 GiB WT cache. Measured 69 MiB empty; the WT cap bounds
    # most growth, so 512m was generous — spent on mysql/app instead.
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${DATA_DIR:-./data}/mongo:/data/db

  # nginx image with the built frontend and nginx.conf baked in
  # (Dockerfile.frontend) — nginx.conf changes ship via a CI rebuild.
  nginx:
    image: ${FRONTEND_IMAGE:-ghcr.io/averyhinazuki/shophub-frontend:latest}
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
    depends_on:
      - app

  # Host-level metrics (disk, CPU, memory) for the box itself — the containers
  # can look healthy while /data fills up under them.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      # Makes the EBS volume report as mountpoint="/data", not "/host/root/data".
      - --path.rootfs=/host/root
      # Report the host's filesystems, not the container's own overlay mounts.
      # $$ is compose escaping for a literal $ in the regex.
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    mem_limit: 128m
    # Loopback only, same posture as prometheus/grafana below.
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave

  prometheus:
    image: ${PROMETHEUS_IMAGE:-ghcr.io/averyhinazuki/shophub-prometheus:latest}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    # Measured 43 MiB (17% of the 256m first proposed); 192m still ample for 7d.
    mem_limit: 192m
    # Loopback only: reachable by the on-box SSM agent, never the internet.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ${DATA_DIR:-./data}/prometheus:/prometheus
    depends_on:
      - app
      - node-exporter

  grafana:
    image: ${GRAFANA_IMAGE:-ghcr.io/averyhinazuki/shophub-grafana:latest}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    # Measured 50 MiB (19% of 256m).
    mem_limit: 192m
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ${DATA_DIR:-./data}/grafana:/var/lib/grafana
    depends_on:
      - prometheus

# No named volumes — five services bind-mount subdirectories of the EBS volume
# at /data: mysql, mongodb, redis (AOF), prometheus and grafana.

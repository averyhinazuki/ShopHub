# Trimmed compose stack for the first cloud deploy (Terraform Step 1, see
# docs/DEVOPS_ROADMAP.md and docs/DEPLOY.md).
#
# What's DIFFERENT from docker-compose.yml:
#   - app image comes from GHCR (`image:`, not `build:`) — the instance never
#     runs a Maven build, it just pulls what CI already published.
#   - Kafka and MongoDB are INCLUDED (the first deploy trimmed them, which
#     broke checkout: OrderService.initiateCheckout() only publishes a
#     CheckoutRequestedEvent and returns 202 Accepted — the actual stock
#     deduction and order creation happen in CheckoutRequestedConsumer, a
#     Kafka listener. No broker = every checkout stuck PENDING forever.)
#     Kafka runs single-node in KRaft mode (Kafka 3.x is its own controller,
#     no ZooKeeper) with replication factor 1 — fine for one box, the
#     opposite of a production cluster.
#   - Middleware ports are NOT published to the host, unlike the dev compose
#     file: containers reach each other by service name on the internal
#     network, and an internet-facing box should expose nothing it doesn't
#     have to (defense in depth behind the security group).
#   - nginx is added in front, serving the built frontend and reverse-proxying
#     /api to the app. It runs from the shophub-frontend image built by CI
#     (Dockerfile.frontend: nginx + dist + infra/nginx/nginx.conf baked in),
#     so the frontend deploys by image pull — no manual scp of frontend/dist.
#   - Memory is capped everywhere on purpose. Sized for a 4 GiB instance
#     (c7i-flex.large): app ~700M + MySQL ~500M + Kafka ~400M + Mongo ~350M
#     + Redis ~150M + nginx, leaving headroom for the OS and page cache.
#     Does NOT fit in a t3.small — keep instance_type in terraform.tfvars in
#     sync with this file.
#
# Secrets (MYSQL_ROOT_PASSWORD, JWT_SECRET) are NOT hardcoded here — they are
# read from a .env file placed next to this compose file at deploy time by
# Terraform's user-data script (infra/terraform/user_data.sh.tpl), sourced
# from terraform.tfvars. That keeps them out of this file (which is tracked
# in git) — see the "Secrets management" gap in docs/DEVOPS_ROADMAP.md.

services:

  app:
    image: ${APP_IMAGE:-ghcr.io/averyhinazuki/shophub:latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/flash_sale_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/flash_sale_logs
      JWT_SECRET: ${JWT_SECRET}
      # Cap the JVM heap explicitly instead of letting it default to 25% of
      # container memory (fine on a normal host, too generous with five
      # other processes sharing a 4 GiB box).
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started   # Kafka has no simple health-check command

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: flash_sale_db
    # innodb-buffer-pool-size defaults to 128MB anyway on modest hosts, but
    # setting it explicitly documents the budget instead of leaving it to
    # MySQL's auto-sizing heuristics.
    command: --innodb-buffer-pool-size=128M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    restart: unless-stopped
    # Small, bounded cache — this box isn't sized to let Redis grow unchecked.
    command: --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Lifted from the dev compose file (a proven-working single-node KRaft
  # config), with three deploy-environment changes: no published port, a
  # restart policy, and a capped heap. One deliberate fix: the controller
  # quorum voter address uses the service name instead of dev's `localhost`
  # (same effect single-node, but correct if this ever splits into
  # broker+controller containers).
  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Kafka's default 1 GiB heap is cluster-sized; a single-node broker
      # moving this app's event volume is comfortable in a quarter of that.
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    # No volume: in-flight events are transient by design here — MySQL is
    # the source of truth, and a broker restart losing queued checkout
    # events is acceptable on a learning box.

  mongodb:
    image: mongo:6
    restart: unless-stopped
    # WiredTiger's default cache is ~50% of RAM — fine on a dedicated DB
    # host, greedy here. 0.25 GiB is plenty for activity logs.
    command: --wiredTigerCacheSizeGB 0.25
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo_data:/data/db

  # The frontend image (see Dockerfile.frontend) is nginx with the built
  # frontend AND nginx.conf baked in — pulled from GHCR like the app image,
  # instead of bind-mounting files that had to be scp'd to the host first.
  # Changing nginx.conf now means a CI rebuild, not an edit on the box.
  nginx:
    image: ${FRONTEND_IMAGE:-ghcr.io/averyhinazuki/shophub-frontend:latest}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  mysql_data:
  mongo_data:

apiVersion: 1

# Grafana's DB lives on the persisted EBS volume (/var/lib/grafana), so it
# already holds a Prometheus datasource created before `uid` was pinned below.
# Delete-then-recreate makes the uid change deterministic instead of relying on
# provisioning to update the uid of an existing record in place.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  # Explicit uid so the dashboard can reference this datasource by name rather
  # than relying on isDefault — keeps panels working if another datasource is
  # ever added and becomes the default.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

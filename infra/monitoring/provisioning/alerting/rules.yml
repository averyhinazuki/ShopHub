# Grafana unified-alerting rules, provisioned at startup (Dockerfile.grafana
# copies all of provisioning/ into /etc/grafana/provisioning/).
#
# No contact point is provisioned on purpose: these fire onto Grafana's built-in
# default policy, whose stock email contact point has no SMTP configured, so
# delivery silently no-ops. The rules are there to be *seen* in the Alerting UI.
# Wiring a real notification channel (SMTP/Slack) is deliberate backlog, not an
# oversight -- it needs a secret and a destination this project doesn't have.
#
# Each rule is the standard three-node chain: A = the Prometheus query,
# B = reduce it to a single number, C = compare that number to a threshold.
apiVersion: 1

groups:
  - orgId: 1
    name: shophub
    folder: ShopHub
    interval: 1m
    rules:
      - uid: shophub-app-scrape-down
        title: App scrape down
        condition: C
        for: 2m
        noDataState: NoData
        execErrState: Error
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: Prometheus cannot scrape the app's /actuator/prometheus endpoint.
          description: >-
            The app container is down, unhealthy, or Spring Security is
            rejecting the scrape. Check `docker compose logs app`.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              expr: up{job="shophub"}
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: shophub-p99-latency-high
        title: p99 latency above 1s
        condition: C
        for: 5m
        # OK, not NoData: with the actuator scrape excluded, an idle site produces
        # no samples at all, so NoData is this rule's resting state and Grafana
        # would raise a permanent DatasourceNoData instance. No traffic genuinely
        # means no latency problem. The other two rules keep NoData, because their
        # metrics always exist -- absence there is a real signal.
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: p99 HTTP latency has been over 1s for 5 minutes.
          description: >-
            Checkout acknowledgment normally sits in single-digit ms. Sustained
            p99 over 1s means the app, MySQL, or Redis is struggling.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              # Same actuator exclusion as the dashboard's latency panel: the
              # 15s self-scrape is fast and would drag the quantile down.
              expr: histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{uri!="/actuator/prometheus"}[5m])) by (le))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [1] }

      - uid: shophub-data-volume-filling
        title: /data volume under 20% free
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: The EBS data volume is running out of space.
          description: >-
            /data backs the Prometheus TSDB, MySQL, and Mongo. Filling it takes
            all three down at once. See docs/MONITORING.md.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              expr: node_filesystem_avail_bytes{mountpoint="/data"} / node_filesystem_size_bytes{mountpoint="/data"}
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [0.2] }

      # ── Domain rules ────────────────────────────────────────────────────────
      # noDataState is OK on both, and that is a deliberate difference from the
      # three rules above rather than a copy-paste slip. Those query up{} and
      # node_filesystem_*, which always exist, so absence there is genuinely
      # abnormal. These query application counters, and DomainMetrics registers
      # every counter at startup precisely so the series exist at zero — but
      # before the first scrape after a restart, or if the app is down, there is
      # legitimately nothing to read, and that case is already covered by
      # "App scrape down". Leaving NoData here would give a second, redundant
      # standing alert of exactly the shape that made the p99 rule rest in
      # DatasourceNoData (PR #9).

      - uid: shophub-checkout-dlt-nonempty
        title: Checkouts reaching the dead-letter topic
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: A checkout exhausted every retry and landed in the DLT.
          description: >-
            By definition nobody has looked at these. Each one is a customer whose
            checkout did not complete, and per F1 a real order may exist anyway --
            check checkout:{id} in Redis against the orders table before replying
            to anyone. See docs/study/90-findings.md (F1).
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              expr: sum(increase(shophub_checkout_dlt_total[1h]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: shophub-stock-restore-abandoned
        title: Stock restoration abandoned
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: Stock was deducted and never restored -- inventory disagrees with orders.
          description: >-
            source=checkout is F13: the compensation loop failed and those units are
            permanently lost. source=expiry is F2: an order was cancelled but its
            stock was not returned, per item, so a cancellation can be partially
            restored. Repeated occurrences shrink inventory monotonically until
            products read sold-out while sitting in the warehouse. Reconcile against
            product_inventory. See docs/study/90-findings.md (F2, F13).
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              expr: sum(increase(shophub_stock_restore_failed_total[1h]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

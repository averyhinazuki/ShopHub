name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: flash_sale_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      kafka:
        image: apache/kafka:3.7.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        ports:
          - 9092:9092

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn test --no-transfer-progress

  publish:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: test                          # only runs if test job passes
    if: github.ref == 'refs/heads/main'  # only on merges to main, not PRs

    permissions:
      contents: read
      packages: write                    # required to push to GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # auto-injected, no setup needed

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shophub:latest
            ghcr.io/${{ github.repository_owner }}/shophub:${{ github.sha }}

      # Frontend ships as its own image (nginx + built dist + nginx.conf baked
      # in) so the instance can pull it from GHCR like the backend — no more
      # building locally and scp'ing frontend/dist to the box.
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shophub-frontend:latest
            ghcr.io/${{ github.repository_owner }}/shophub-frontend:${{ github.sha }}

  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: publish                       # fresh images must exist first
    if: github.ref == 'refs/heads/main'

    steps:
      # Credentials for the shophub-ci IAM user (see infra/terraform/iam.tf),
      # stored as repo secrets. The user can only send the run-shell-script
      # SSM document to instances tagged Name=shophub — nothing else.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # No SSH, no host IP secret: the instance is found by tag (survives
      # destroy/re-apply, unlike IDs and IPs), and the command is relayed by
      # Systems Manager to the SSM agent already running on the box.
      - name: Pull images and restart the stack
        run: |
          set -euo pipefail

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=shophub" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No running shophub instance — skipping deploy (images are published; next terraform apply picks them up)."
            exit 0
          fi
          echo "Deploying to $INSTANCE_ID"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ShopHub deploy ${GITHUB_SHA::7}" \
            --parameters 'commands=["cd /opt/shophub && docker compose -f docker-compose.cloud.yml --env-file .env pull -q && docker compose -f docker-compose.cloud.yml --env-file .env up -d"]' \
            --query "Command.CommandId" --output text)

          # Poll until the command reaches a terminal state. (aws ssm wait
          # gives up after ~100s; an image pull can take longer.)
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|DeliveryTimedOut) break ;;
            esac
            sleep 10
          done

          # Surface the box's own stdout/stderr in the Actions log, then
          # fail the job unless the command actually succeeded.
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output table
          [ "$STATUS" = "Success" ]

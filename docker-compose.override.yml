# Local-only override (auto-merged by Docker Compose, not committed).
# Runs the app from a HOST-built jar via Dockerfile.runtime, instead of the
# published ghcr image or the slow in-container Maven build. So the load test
# exercises the CURRENT async code. Build the jar first: mvn package -DskipTests
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    image: shophub:local
    environment:
      # Seeding 5000 users + the JMeter run can exceed the default 5-min token
      # TTL, which would turn checkouts into 401s. Bump to 1h for the test.
      APP_JWT_ACCESS_EXPIRATION_MS: "3600000"

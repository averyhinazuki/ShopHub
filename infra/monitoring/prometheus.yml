# Scrapes the ShopHub app's Actuator endpoint over the internal Docker network.
# The app no longer publishes :8080 publicly (see docker-compose.cloud.yml).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: shophub
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:8080']

  # Self-scrape: makes Prometheus' own health visible on the same dashboard.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Host metrics. The service name resolves in both compose files.
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

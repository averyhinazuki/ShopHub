spring:
  application:
    name: shop-hub

  # MySQL
  datasource:
    url: jdbc:mysql://localhost:3306/flash_sale_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, Hibernate only verifies it
    show-sql: false

  # Flyway — versioned migrations in classpath:db/migration.
  # baseline-on-migrate: pre-Flyway databases (tables exist, no history table)
  # are baselined at V1 instead of failing; fresh databases run V1__init.sql.
  flyway:
    baseline-on-migrate: true

  # MongoDB + Redis
  data:
    mongodb:
      uri: mongodb://localhost:27017/flash_sale_logs
      # Load-bearing. Spring Boot 3 defaults this to false, which makes every
      # @Indexed / @CompoundIndex on the two @Document classes inert — including
      # their TTL indexes, so the audit collections would grow forever while
      # looking like they had retention. Two collections, so startup cost is nil.
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379

  # Kafka
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: flash-sale-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      # All three topics are created with 3 partitions, but
      # ConcurrentKafkaListenerContainerFactory defaults to concurrency 1, so one
      # thread was assigned all three and drained them sequentially — the async
      # checkout design ran at a third of its intended rate. 3 is the ceiling:
      # partition count bounds parallelism, so raising it further gains nothing
      # without adding partitions.
      concurrency: 3

  # Jackson — serialize LocalDateTime as ISO string, not [year,month,day,...] array
  jackson:
    serialization:
      write-dates-as-timestamps: false

  # Multipart file upload config
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# App config (custom keys — not Spring's)
# Secrets come from environment variables; defaults below are for local dev only.
app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-256-bit-secret-key-do-not-use-in-production}
    access-expiration-ms: 300000     # 5 minutes
    refresh-expiration-ms: 86400000  # 1 day
  order:
    pending-timeout-minutes: 15
    expiry-job-interval-seconds: 60
    expiry-job-batch-size: 100
  checkout:
    status-ttl-minutes: 30
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

server:
  port: 8080
  tomcat:
    threads:
      max: 800
      min-spare: 100
    accept-count: 5000
    max-connections: 10000
    connection-timeout: 120000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: shop-hub
    distribution:
      percentiles-histogram:
        http.server.requests: true
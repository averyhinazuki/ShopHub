name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  # Manual escape hatch. The path filters below deliberately do NOT treat a
  # change to this workflow as a reason to rebuild the images, so when a build
  # step itself changes (cache scope, tags, buildx setup) there may be no code
  # change to piggyback on — trigger a run by hand instead.
  workflow_dispatch:

jobs:
  # ── What changed? ─────────────────────────────────────────────────────────
  # Classifies the push so downstream jobs can skip work that can't possibly
  # be affected (a favicon change doesn't need the Maven test suite, and —
  # more importantly — not rebuilding the backend image means the app
  # container isn't needlessly recreated on deploy).
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read   # lets paths-filter read changed files on PR events
    # On workflow_dispatch there is no diff to compute: paths-filter would
    # default `base` to the default branch and `ref` to HEAD, so dispatching
    # from main compares main against main, finds an empty changeset, and
    # reports NOTHING changed. A manual run would then skip every build while
    # still reporting green — the worst possible failure mode for an escape
    # hatch. A manual run means "build everything", so say so explicitly.
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
      frontend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            # Paths that genuinely change BOTH images' contents. The test is
            # narrow on purpose: "does editing this file change what ends up
            # inside an image?" — not "is this file vaguely build-related".
            #
            # .dockerignore qualifies because both builds use `context: .`, so
            # it decides what each build context contains.
            #
            # Two files were deliberately REMOVED from this list:
            #   - this workflow — it orchestrates builds but is not an input to
            #     them; see workflow_dispatch above for the manual override.
            #   - docker-compose.cloud.yml — it is not an image input either,
            #     and CI never ships it: the instance's copy is written by
            #     cloud-init from Terraform's templatefile() (user_data.sh.tpl),
            #     so editing it requires `terraform apply`, not a rebuild.
            shared: &shared
              - '.dockerignore'
            backend:
              - *shared
              - 'src/**'
              - 'pom.xml'
              - 'Dockerfile'
            frontend:
              - *shared
              - 'frontend/**'
              - 'Dockerfile.frontend'
              - 'infra/nginx/**'

  test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: flash_sale_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      kafka:
        image: apache/kafka:3.7.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        ports:
          - 9092:9092

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn test --no-transfer-progress

  # Backend and frontend publish as SEPARATE jobs so each can be skipped
  # independently. If a job is skipped, everything that `needs` it is skipped
  # too (unless it opts out, like deploy below) — that's why publish-backend
  # depending on a skipped test job does the right thing for free.
  publish-backend:
    name: Build & push backend image
    runs-on: ubuntu-latest
    needs: [ changes, test ]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.backend == 'true'

    permissions:
      contents: read
      packages: write                    # required to push to GHCR

    steps:
      - uses: actions/checkout@v4

      # The gha cache backend needs BuildKit's docker-container driver;
      # runners default to the plain docker driver, which can't export cache
      # ("Cache export is not supported for the docker driver"). This step
      # creates a properly-drivered builder that build-push-action picks up.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # auto-injected, no setup needed

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shophub:latest
            ghcr.io/${{ github.repository_owner }}/shophub:${{ github.sha }}
          # Persist Docker layer cache in GitHub's cache backend so unchanged
          # layers (Maven dependency download, especially) are reused across
          # runs — runners are throwaway VMs with no local cache. mode=max
          # also caches intermediate build-stage layers, not just the final
          # image's. `scope` keeps the two images' caches from evicting each
          # other.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  # Frontend ships as its own image (nginx + built dist + nginx.conf baked
  # in) so the instance can pull it from GHCR like the backend — no more
  # building locally and scp'ing frontend/dist to the box. Note: does NOT
  # need the Java test job — only the `changes` classification.
  publish-frontend:
    name: Build & push frontend image
    runs-on: ubuntu-latest
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.frontend == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shophub-frontend:latest
            ghcr.io/${{ github.repository_owner }}/shophub-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: [ publish-backend, publish-frontend ]
    # Either publish job may be legitimately skipped, and skipped `needs`
    # normally skip this job too — `!cancelled()` opts out of that. The rest
    # says: on main, at least one image was published, and nothing failed.
    if: >-
      ${{ !cancelled() &&
          github.ref == 'refs/heads/main' &&
          contains(needs.*.result, 'success') &&
          !contains(needs.*.result, 'failure') }}

    steps:
      # Credentials for the shophub-ci IAM user (see infra/terraform/iam.tf),
      # stored as repo secrets. The user can only send the run-shell-script
      # SSM document to instances tagged Name=shophub — nothing else.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # No SSH, no host IP secret: the instance is found by tag (survives
      # destroy/re-apply, unlike IDs and IPs), and the command is relayed by
      # Systems Manager to the SSM agent already running on the box.
      # `docker compose up -d` only recreates containers whose image actually
      # changed, so a frontend-only deploy leaves the app (and its JVM warmup)
      # alone.
      - name: Pull images and restart the stack
        run: |
          set -euo pipefail

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=shophub" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No running shophub instance — skipping deploy (images are published; next terraform apply picks them up)."
            exit 0
          fi
          echo "Deploying to $INSTANCE_ID"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ShopHub deploy ${GITHUB_SHA::7}" \
            --parameters 'commands=["cd /opt/shophub && docker compose -f docker-compose.cloud.yml --env-file .env pull -q && docker compose -f docker-compose.cloud.yml --env-file .env up -d"]' \
            --query "Command.CommandId" --output text)

          # Poll until the command reaches a terminal state. (aws ssm wait
          # gives up after ~100s; an image pull can take longer.)
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|DeliveryTimedOut) break ;;
            esac
            sleep 10
          done

          # Surface the box's own stdout/stderr in the Actions log, then
          # fail the job unless the command actually succeeded.
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output table
          [ "$STATUS" = "Success" ]

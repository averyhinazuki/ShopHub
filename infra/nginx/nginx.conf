# nginx config for the ShopHub cloud deploy. Mounted read-only into the
# nginx container by docker-compose.cloud.yml at
# /etc/nginx/conf.d/default.conf (replacing the image's stock default site).
#
# Two jobs:
#   1. Serve the built Vue frontend (frontend/dist, built with `npm run
#      build` — see docs/DEPLOY.md) as static files.
#   2. Reverse-proxy API calls to the Spring Boot app container on port 8080
#      (confirmed via src/main/resources/application.yml: `server.port: 8080`,
#      and every @RestController is mapped under /api — see e.g.
#      AuthController, ProductController).
#
# Splitting on the /api prefix means the app container never needs to be
# exposed to the internet directly; nginx is the only thing port 80/443
# reaches (see infra/terraform/security.tf).

server {
    listen 80;
    server_name _;

    # ── API traffic → Spring Boot ───────────────────────────────────────
    location /api/ {
        proxy_pass http://app:8080;

        # Forward the original request details; without these the app sees
        # every request as coming from the nginx container itself, which
        # breaks anything relying on client IP or the original Host/scheme
        # (e.g. building absolute URLs, rate limiting, logging).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The flash-sale checkout path is the whole point of this app —
        # give it more headroom than nginx's default 60s so a slow backend
        # response doesn't get cut off mid-request under load.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ── Everything else → static frontend (Vue SPA) ─────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Vue Router runs in HTML5 history mode (createWebHistory() in
        # frontend/src/router/index.js), meaning routes like /products/42
        # have no matching file on disk. try_files falls back to
        # index.html so Vue Router can take over client-side instead of
        # nginx returning a 404 for a valid in-app route.
        try_files $uri $uri/ /index.html;
    }

    # Let static assets (JS/CSS/images, content-hashed by Vite) be cached
    # aggressively by the browser — their filenames change on every build,
    # so there's no staleness risk.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires    30d;
        add_header Cache-Control "public, immutable";
    }
}

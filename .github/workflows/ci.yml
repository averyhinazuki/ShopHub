name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  # Manual trigger — needed because a change to this workflow alone doesn't
  # match the path filters below and so triggers no build.
  workflow_dispatch:

jobs:
  # Classify the push so downstream jobs skip unaffected work (and, notably,
  # avoid recreating the app container when the backend image is unchanged).
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read   # lets paths-filter read changed files on PRs
    # workflow_dispatch has no diff, so paths-filter would compare main against
    # main and report nothing changed — skipping every build while reporting
    # green. Force both to true for a manual run ("build everything").
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
      frontend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            # Only paths that change an image's contents. `.dockerignore` counts
            # because both builds use context: `.`. This workflow and
            # docker-compose.cloud.yml are excluded — neither is an image input
            # (the compose file ships via terraform apply, not CI).
            shared: &shared
              - '.dockerignore'
            backend:
              - *shared
              - 'src/**'
              - 'pom.xml'
              - 'Dockerfile'
            frontend:
              - *shared
              - 'frontend/**'
              - 'Dockerfile.frontend'
              - 'infra/nginx/**'

  test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.TEST_MYSQL_PASSWORD }}
          MYSQL_DATABASE: flash_sale_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      kafka:
        image: apache/kafka:3.7.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        ports:
          - 9092:9092

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn test --no-transfer-progress
        env:
          MYSQL_PASSWORD: ${{ secrets.TEST_MYSQL_PASSWORD }}

  # Separate publish jobs so each image can be skipped independently; a skipped
  # job also skips whatever `needs` it (except deploy, which opts out).
  publish-backend:
    name: Build & push backend image
    runs-on: ubuntu-latest
    needs: [ changes, test ]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.backend == 'true'

    permissions:
      contents: read
      packages: write                    # required to push to GHCR

    steps:
      - uses: actions/checkout@v4

      # gha cache export needs BuildKit's docker-container driver, which the
      # runner's default docker driver can't do.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # auto-injected

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shophub:latest
            ghcr.io/${{ github.repository_owner }}/shophub:${{ github.sha }}
          # Reuse unchanged layers (Maven deps) across throwaway runners.
          # mode=max caches intermediate stages; scope isolates the two images.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  # Frontend image (nginx + dist + nginx.conf). Independent of the test job.
  publish-frontend:
    name: Build & push frontend image
    runs-on: ubuntu-latest
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.frontend == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shophub-frontend:latest
            ghcr.io/${{ github.repository_owner }}/shophub-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: [ publish-backend, publish-frontend ]
    # !cancelled() runs deploy even when a publish job was skipped; the rest
    # requires main, at least one success, and no failure.
    if: >-
      ${{ !cancelled() &&
          github.ref == 'refs/heads/main' &&
          contains(needs.*.result, 'success') &&
          !contains(needs.*.result, 'failure') }}

    # id-token: write is required to mint the OIDC token; naming any permission
    # resets the rest, so contents: read must be restated.
    permissions:
      id-token: write
      contents: read

    steps:
      # OIDC, no access keys: AWS validates the token against the shophub-ci
      # trust policy (infra/terraform/iam.tf) and returns ~1h credentials scoped
      # to SendCommand on instances tagged Name=shophub. AWS_ROLE_ARN is a repo
      # secret only to keep the account ID out of a public repo.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # No SSH: find the instance by tag and relay the command via SSM.
      # `docker compose up -d` only recreates containers whose image changed, so
      # a frontend-only deploy leaves the app untouched.
      - name: Pull images and restart the stack
        run: |
          set -euo pipefail

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=shophub" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No running shophub instance — skipping deploy (images are published; next terraform apply picks them up)."
            exit 0
          fi
          echo "Deploying to $INSTANCE_ID"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ShopHub deploy ${GITHUB_SHA::7}" \
            --parameters 'commands=["cd /opt/shophub && docker compose -f docker-compose.cloud.yml --env-file .env pull -q && docker compose -f docker-compose.cloud.yml --env-file .env up -d"]' \
            --query "Command.CommandId" --output text)

          # Poll to a terminal state (`aws ssm wait` caps at ~100s; pulls run longer).
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|DeliveryTimedOut) break ;;
            esac
            sleep 10
          done

          # Surface the box's stdout/stderr, then fail unless the command succeeded.
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output table
          [ "$STATUS" = "Success" ]

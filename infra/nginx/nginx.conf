# nginx config for the ShopHub cloud deploy. Mounted read-only at
# /etc/nginx/conf.d/default.conf by docker-compose.cloud.yml.
#
# Serves the built Vue frontend as static files and reverse-proxies /api/ to the
# Spring Boot app on :8080. Splitting on /api keeps the app container off the
# public internet — only nginx binds 80/443 (see infra/terraform/security.tf).

server {
    listen 80;
    server_name _;

    # ── API traffic → Spring Boot ───────────────────────────────────────
    location /api/ {
        proxy_pass http://app:8080;

        # Forward original request details so the app sees the real client,
        # not the nginx container.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Headroom for the flash-sale checkout path under load.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ── Everything else → static frontend (Vue SPA) ─────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Vue Router uses HTML5 history mode, so client-side routes have no file
        # on disk. Fall back to index.html instead of returning 404.
        try_files $uri $uri/ /index.html;
    }

    # Content-hashed assets — safe to cache aggressively.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires    30d;
        add_header Cache-Control "public, immutable";
    }
}
